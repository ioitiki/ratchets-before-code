[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
ledger-api = { path = "crates/ledger-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
ledger-core = { path = "crates/ledger-core" }
ledger-store = { path = "crates/ledger-store" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
